<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RingSymphony · 指环指挥</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <span class="brand">指环指挥<small>RING SYMPHONY</small></span>
        <span id="status">选关</span>
      </header>

      <section id="home">
        <p class="eyebrow">TAKE THE PODIUM</p>
        <h1>让乐声，随你而起。</h1>
        <p class="intro">右手掌握节拍，左手唤醒乐团。<br>站上指挥台，开始你的第一场演出。</p>
        <div id="level-list"></div>
      </section>

      <section id="play" hidden>
        <div class="frame hall">
          <canvas id="view" aria-label="第一人称乐团舞台：方向键或右侧滑动打拍，点击乐手进入，E 渐强，D 渐弱"></canvas>
          <div id="progress"><span id="progress-fill"></span></div>
          <div class="session"><h2>练习曲</h2><p>ÉTUDE I　 /　 4:4　 /　 96 BPM</p></div>
          <div class="tally"><small>PERFORMANCE</small><span id="tally">0000</span></div>
          <div class="conducting-hud"><div class="beats"><i class="beat-dot"></i><i class="beat-dot"></i><i class="beat-dot"></i><i class="beat-dot"></i></div><p id="cue-hint">预备</p></div>
          <p id="grade" aria-live="polite"></p>
          <div id="result" hidden>
            <span class="result-title">演出谢幕 · PERFORMANCE COMPLETE</span>
            <p class="accuracy" id="accuracy"></p>
            <p class="counts" id="counts"></p>
            <div class="actions">
              <button id="retry" type="button">再来一次</button>
              <button id="back" type="button">换一关</button>
            </div>
          </div>
        </div>
        <p id="hint">空格或点按画布</p>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
