<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RingSymphony · 指环指挥</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <span class="brand"><i class="logo" aria-hidden="true">♪</i><span>指环指挥<small>RING SYMPHONY</small></span></span>
        <span class="header-right">
          <button id="ring-btn" type="button" data-state="off">指环 · 桥接未连接</button>
          <button id="settings-btn" type="button">设置</button>
          <span id="status">选关</span>
          <button id="exit" type="button" hidden>返回</button>
        </span>
      </header>
      <aside id="ring-panel" hidden aria-label="指环状态"></aside>
      <aside id="settings-panel" hidden aria-label="设置"></aside>

      <section id="home">
        <p class="eyebrow">TAKE THE PODIUM</p>
        <h1>让乐声，<em>随你而起</em>。</h1>
        <p class="intro">右手掌握节拍，左手唤醒乐团。<br>站上指挥台，开始你的第一场演出。</p>
        <div id="level-list"></div>
      </section>

      <section id="play" hidden>
        <div class="frame hall">
          <canvas id="view" aria-label="第一人称乐团舞台：方向键或右侧滑动打拍，点击乐手进入，E 渐强，D 渐弱"></canvas>
          <canvas id="lane" aria-hidden="true"></canvas>
          <svg id="lasso" aria-hidden="true"><path d="" /></svg>
          <div id="progress"><span id="progress-fill"></span></div>
          <div class="session"><h2 id="session-title">练习曲</h2><p id="session-sub">ÉTUDE I　/　4:4　/　96 BPM</p></div>
          <div class="tally"><small id="tally-label">SCORE</small><span id="tally">0000</span></div>
          <div class="conducting-hud"><div class="beats"><i class="beat-dot"></i><i class="beat-dot"></i><i class="beat-dot"></i><i class="beat-dot"></i></div><p id="cue-hint">预备</p></div>
          <div id="mixer" aria-label="声部"></div>
          <div id="tools" hidden>
            <button type="button" data-act="start" class="candy pink"><b>起奏</b><small>向前一指</small><kbd>F</kbd></button>
            <button type="button" data-act="stop" class="candy lilac"><b>停止</b><small>握拳</small><kbd>G</kbd></button>
            <button type="button" data-act="up" class="candy butter"><b>渐强</b><small>手掌上抬</small><kbd>E</kbd></button>
            <button type="button" data-act="down" class="candy sky"><b>渐弱</b><small>手掌下压</small><kbd>D</kbd></button>
            <button type="button" data-act="solo" class="candy mint"><b>独奏</b><small>其余变轻</small><kbd>S</kbd></button>
            <button type="button" data-act="all" class="candy plain"><b>全选</b><small>整个乐队</small><kbd>A</kbd></button>
          </div>
          <p id="toast" aria-live="polite"></p>
          <div id="result" hidden>
            <div class="result-card">
              <span class="result-title">演出谢幕 · PERFORMANCE COMPLETE</span>
              <p class="stars" id="stars"></p>
              <p class="accuracy" id="accuracy"></p>
              <p class="counts" id="counts"></p>
              <p class="timing" id="timing"></p>
              <div class="actions">
                <button id="retry" type="button" class="candy pink">再来一次</button>
                <button id="back" type="button" class="candy plain">换一关</button>
              </div>
            </div>
          </div>
        </div>
        <p id="hint">空格或点按画布</p>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
